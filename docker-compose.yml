services:
  mysql:
    image: mysql:8.4
    container_name: billing-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      DB_CLIENTS_PASSWORD: ${DB_CLIENTS_PASSWORD:?Set DB_CLIENTS_PASSWORD in .env}
      DB_ABONNEMENTS_PASSWORD: ${DB_ABONNEMENTS_PASSWORD:?Set DB_ABONNEMENTS_PASSWORD in .env}
      DB_FACTURATION_PASSWORD: ${DB_FACTURATION_PASSWORD:?Set DB_FACTURATION_PASSWORD in .env}
      DB_NOTIFICATIONS_PASSWORD: ${DB_NOTIFICATIONS_PASSWORD:?Set DB_NOTIFICATIONS_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init-mysql.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management
    container_name: billing-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  mailhog:
    image: mailhog/mailhog
    container_name: billing-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql-data:
