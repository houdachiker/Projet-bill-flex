<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1100" width="1500" height="1100" font-family="'Segoe UI','DejaVu Sans',Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#1d2b53" stroke-width="1.6"/>
    </marker>
    <marker id="dia" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="14" markerHeight="10" orient="auto-start-reverse">
      <path d="M1,5 L7,1 L13,5 L7,9 Z" fill="#1d2b53"/>
    </marker>
  </defs>
  <rect width="1500" height="1100" fill="#ffffff"/>
  <text x="750" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#1d2b53">Bill-Flex — Diagramme de classes global</text>

  <!-- ===== Packages ===== -->
  <g fill="#f8fbff" stroke="#8fb4d9" stroke-width="2" rx="8">
    <rect x="30" y="60" width="560" height="420" rx="8"/>
    <rect x="640" y="60" width="830" height="420" rx="8"/>
    <rect x="30" y="540" width="630" height="450" rx="8"/>
  </g>
  <g font-size="18" font-weight="700" fill="#1d2b53" text-anchor="middle">
    <text x="310" y="88">service-abonnements :8082</text>
    <text x="1055" y="88">service-clients :8081</text>
    <text x="345" y="568">service-facturation :8083</text>
  </g>

  <!-- ===== service-abonnements ===== -->
  <g stroke="#222" stroke-width="2">
    <!-- Plan -->
    <rect x="55" y="110" width="210" height="152" rx="6" fill="#fdeefe"/>
    <line x1="55" y1="144" x2="265" y2="144"/>
    <!-- SubscriptionStatus -->
    <rect x="55" y="295" width="210" height="108" rx="6" fill="#fff1dd"/>
    <line x1="55" y1="329" x2="265" y2="329"/>
    <!-- Subscription -->
    <rect x="320" y="110" width="240" height="196" rx="6" fill="#e0f3fd"/>
    <line x1="320" y1="144" x2="560" y2="144"/>
  </g>
  <g stroke="#222" stroke-width="1.5">
    <circle cx="75" cy="127" r="10" fill="#a8dcb0"/>
    <circle cx="75" cy="312" r="10" fill="#f4a98d"/>
    <circle cx="340" cy="127" r="10" fill="#a8dcb0"/>
  </g>
  <g font-size="12" font-weight="700" fill="#1d2b53" text-anchor="middle">
    <text x="75" y="131">C</text><text x="75" y="316">E</text><text x="340" y="131">C</text>
  </g>
  <g font-size="15" font-weight="700" fill="#1d2b53">
    <text x="95" y="132">Plan</text>
    <text x="95" y="317">SubscriptionStatus</text>
    <text x="360" y="132">Subscription</text>
  </g>
  <g font-size="13" fill="#1d2b53">
    <text x="67" y="166">-Long id</text><text x="67" y="188">-String nom</text><text x="67" y="210">-BigDecimal prixMensuel</text>
    <text x="67" y="232">-int quotaUtilisateurs</text><text x="67" y="254">-boolean actif</text>
    <text x="67" y="351">ACTIF</text><text x="67" y="373">SUSPENDU</text><text x="67" y="395">RESILIE</text>
    <text x="332" y="166">-Long id</text><text x="332" y="188">-Long clientId</text><text x="332" y="210">-Plan plan</text>
    <text x="332" y="232">-LocalDate dateDebut</text><text x="332" y="254">-LocalDate dateFin</text>
    <text x="332" y="276">-LocalDate prochaineEcheance</text><text x="332" y="298">-SubscriptionStatus statut</text>
  </g>

  <!-- ===== service-clients ===== -->
  <g stroke="#222" stroke-width="2">
    <rect x="665" y="110" width="230" height="152" rx="6" fill="#e3f9ec"/>
    <line x1="665" y1="144" x2="895" y2="144"/>
    <rect x="665" y="295" width="230" height="108" rx="6" fill="#fff1dd"/>
    <line x1="665" y1="329" x2="895" y2="329"/>
    <rect x="950" y="110" width="240" height="174" rx="6" fill="#dcfaf3"/>
    <line x1="950" y1="144" x2="1190" y2="144"/>
    <rect x="1230" y="110" width="210" height="108" rx="6" fill="#fff1dd"/>
    <line x1="1230" y1="144" x2="1440" y2="144"/>
  </g>
  <g stroke="#222" stroke-width="1.5">
    <circle cx="685" cy="127" r="10" fill="#a8dcb0"/>
    <circle cx="685" cy="312" r="10" fill="#f4a98d"/>
    <circle cx="970" cy="127" r="10" fill="#a8dcb0"/>
    <circle cx="1250" cy="127" r="10" fill="#f4a98d"/>
  </g>
  <g font-size="12" font-weight="700" fill="#1d2b53" text-anchor="middle">
    <text x="685" y="131">C</text><text x="685" y="316">E</text><text x="970" y="131">C</text><text x="1250" y="131">E</text>
  </g>
  <g font-size="15" font-weight="700" fill="#1d2b53">
    <text x="705" y="132">Client</text>
    <text x="705" y="317">ModePaiement</text>
    <text x="990" y="132">Payment</text>
    <text x="1270" y="132">PaymentStatus</text>
  </g>
  <g font-size="13" fill="#1d2b53">
    <text x="677" y="166">-Long id</text><text x="677" y="188">-String nom</text><text x="677" y="210">-String email «unique»</text>
    <text x="677" y="232">-String numeroTva</text><text x="677" y="254">-ModePaiement modePaiement</text>
    <text x="677" y="351">CARTE</text><text x="677" y="373">VIREMENT</text><text x="677" y="395">PRELEVEMENT</text>
    <text x="962" y="166">-Long id</text><text x="962" y="188">-Long invoiceId</text><text x="962" y="210">-Long clientId</text>
    <text x="962" y="232">-BigDecimal montant</text><text x="962" y="254">-PaymentStatus statut</text><text x="962" y="276">-LocalDateTime datePaiement</text>
    <text x="1242" y="166">EN_ATTENTE</text><text x="1242" y="188">ENCAISSE</text><text x="1242" y="210">ANNULE</text>
  </g>

  <!-- ===== service-facturation ===== -->
  <g stroke="#222" stroke-width="2">
    <rect x="55" y="600" width="290" height="284" rx="6" fill="#fdeefe"/>
    <line x1="55" y1="634" x2="345" y2="634"/>
    <rect x="420" y="600" width="200" height="152" rx="6" fill="#e3f9ec"/>
    <line x1="420" y1="634" x2="620" y2="634"/>
    <rect x="420" y="790" width="200" height="152" rx="6" fill="#fff1dd"/>
    <line x1="420" y1="824" x2="620" y2="824"/>
  </g>
  <g stroke="#222" stroke-width="1.5">
    <circle cx="75" cy="617" r="10" fill="#a8dcb0"/>
    <circle cx="440" cy="617" r="10" fill="#a8dcb0"/>
    <circle cx="440" cy="807" r="10" fill="#f4a98d"/>
  </g>
  <g font-size="12" font-weight="700" fill="#1d2b53" text-anchor="middle">
    <text x="75" y="621">C</text><text x="440" y="621">C</text><text x="440" y="811">E</text>
  </g>
  <g font-size="15" font-weight="700" fill="#1d2b53">
    <text x="95" y="622">Invoice</text>
    <text x="460" y="622">InvoiceLine</text>
    <text x="460" y="812">InvoiceStatus</text>
  </g>
  <g font-size="13" fill="#1d2b53">
    <text x="67" y="656">-Long id</text><text x="67" y="678">-Long clientId</text><text x="67" y="700">-Long subscriptionId</text>
    <text x="67" y="722">-String periode</text><text x="67" y="744">-InvoiceStatus statut</text><text x="67" y="766">-LocalDate dateEmission</text>
    <text x="67" y="788">-LocalDate dateEcheance</text><text x="67" y="810">-BigDecimal montantHT</text>
    <text x="67" y="832">-BigDecimal tva</text><text x="67" y="854">-BigDecimal montantTTC</text>
    <text x="67" y="876">-List&lt;InvoiceLine&gt; lignes</text>
    <text x="432" y="656">-Long id</text><text x="432" y="678">-String description</text><text x="432" y="700">-int quantite</text>
    <text x="432" y="722">-BigDecimal prixUnitaire</text><text x="432" y="744">-BigDecimal montant</text>
    <text x="432" y="846">BROUILLON</text><text x="432" y="868">EMISE</text><text x="432" y="890">PAYEE</text>
    <text x="432" y="912">EN_RETARD</text><text x="432" y="934">ANNULEE</text>
  </g>


  <!-- ===== Relations internes (trait plein) ===== -->
  <g stroke="#1d2b53" stroke-width="1.8" fill="none">
    <line x1="265" y1="186" x2="320" y2="186" marker-end="url(#arr)"/>
    <line x1="320" y1="276" x2="265" y2="330" marker-end="url(#arr)"/>
    <line x1="780" y1="262" x2="780" y2="295" marker-end="url(#arr)"/>
    <line x1="950" y1="200" x2="895" y2="200" marker-end="url(#arr)"/>
    <line x1="1190" y1="170" x2="1230" y2="170" marker-end="url(#arr)"/>
    <line x1="345" y1="680" x2="420" y2="680" marker-start="url(#dia)" marker-end="url(#arr)"/>
    <line x1="345" y1="850" x2="420" y2="850" marker-end="url(#arr)"/>
  </g>
  <g font-size="12" fill="#1d2b53">
    <text x="268" y="180">1</text><text x="304" y="180">*</text>
    <text x="352" y="674">1</text><text x="392" y="674">1..*</text><text x="357" y="698" font-size="11">lignes</text>
    <text x="358" y="844" font-size="11">statut</text>
    <text x="900" y="194" font-size="11">clientId</text>
  </g>

  <!-- ===== Liens par identifiant inter-services (pointillés) ===== -->
  <g stroke="#1d2b53" stroke-width="1.8" fill="none" stroke-dasharray="7 5">
    <!-- Subscription.clientId -> Client -->
    <line x1="560" y1="150" x2="665" y2="150" marker-end="url(#arr)"/>
    <!-- Invoice.subscriptionId -> Subscription -->
    <path d="M150,600 V500 H440 V306" marker-end="url(#arr)"/>
    <!-- Invoice.clientId -> Client -->
    <path d="M250,600 V515 H615 V225 H665" marker-end="url(#arr)"/>
    <!-- Payment.invoiceId -> Invoice -->
    <path d="M1070,284 V530 H300 V600" marker-end="url(#arr)"/>
  </g>
  <g font-size="11" fill="#1d2b53">
    <text x="568" y="143">clientId</text>
    <text x="162" y="494">subscriptionId</text>
    <text x="470" y="510">clientId</text>
    <text x="930" y="524">invoiceId</text>
  </g>

  <!-- ===== Légende ===== -->
  <g transform="translate(0,-110)">
    <rect x="30" y="1120" width="720" height="74" rx="8" fill="#ffffff" stroke="#1d2b53" stroke-width="1.5"/>
    <line x1="50" y1="1142" x2="110" y2="1142" stroke="#1d2b53" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="125" y="1146" font-size="13" fill="#1d2b53">Relation interne au service</text>
    <line x1="50" y1="1166" x2="110" y2="1166" stroke="#1d2b53" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arr)"/>
    <text x="125" y="1170" font-size="13" fill="#1d2b53">Lien par identifiant inter-services (pas de clé étrangère entre bases)</text>
  </g>
</svg>
